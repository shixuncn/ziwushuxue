<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe4">
<title>子午穴枢 · 正在打开</title>
<link rel="canonical" href="https://shixuncn.github.io/ziwushuxue/app.html">
<meta http-equiv="refresh" content="0;url=./app.html">
<style>
  :root{--paper:#f4efe4;--card:#fffdf6;--ink:#2a2620;--ink2:#6b6252;--red:#a8402f;--line:#e7decb}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
    font-family:"Songti SC","STSong","Noto Serif CJK SC",ui-serif,Georgia,serif;
    display:grid;place-items:center;padding:24px}
  .box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:24px 22px;text-align:center;box-shadow:0 8px 22px -12px rgba(70,55,30,.18)}
  h1{margin:0 0 8px;font-size:20px;letter-spacing:2px}
  p{margin:0 0 18px;font-size:14px;line-height:1.7;color:var(--ink2)}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
    padding:10px 18px;border-radius:10px;background:var(--red);color:#fff8ee;
    text-decoration:none;font-size:15px;letter-spacing:1px}
  a:focus-visible{outline:2px solid var(--red);outline-offset:3px}
</style>
<script>
  location.replace('./app.html' + location.search + location.hash);
</script>
</head>
<body>
  <div class="box">
    <h1>子午穴枢</h1>
    <p>正在打开新版页面…如果浏览器没有自动跳转，请点下方按钮。</p>

</body>
