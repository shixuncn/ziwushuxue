name: iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm ci || npm install

      - name: 同步网页资源到原生工程
        run: |
          npm run copy:web
          npx cap sync ios

      - name: 安装 CocoaPods 依赖
        run: |
          cd ios/App
          pod install --repo-update

      - name: 编译（未签名）
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包为 ipa（未签名）
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r weidan-unsigned.ipa Payload

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: weidan-ios-ipa-unsigned
          path: weidan-unsigned.ipa
