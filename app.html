<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe4">
<meta name="description" content="子午穴枢 · 按时取穴 · 灵龟八法 / 飞腾八法 / 子午流注 / 五运六气 / 五腧穴 / 头皮针 / 眼针 / 脐针 / 董氏奇穴 —— 每日自动计算的中医时间针法小程序">
<link rel="manifest" href="子午穴枢.manifest.webmanifest">
<link rel="icon" href="子午穴枢.icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="子午穴枢.icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="子午穴枢.icon180.png">
<link rel="apple-touch-icon" sizes="152x152" href="子午穴枢.icon152.png">
<link rel="apple-touch-icon" sizes="144x144" href="子午穴枢.icon144.png">
<link rel="apple-touch-icon" sizes="120x120" href="子午穴枢.icon120.png">
<link rel="apple-touch-icon" sizes="76x76" href="子午穴枢.icon76.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>子午穴枢 · 按时取穴 · 灵龟八法 / 子午流注 / 五运六气</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --paper:#f4efe4;--card:#fffdf6;--ink:#2a2620;--ink2:#7a7161;--ink3:#a29a8a;
    --line:#e7decb;--red:#a8402f;--red2:#c4604a;--redsoft:#f7e9e3;
    --jade:#3c6a58;--gold:#a8874f;--shadow:0 1px 2px rgba(70,55,30,.05),0 8px 22px -12px rgba(70,55,30,.18);
  }
  html{background:var(--paper)}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(900px 420px at 50% -8%,#fffbf2 0%,rgba(255,251,242,0) 62%),var(--paper);
    color:var(--ink);font-size:15px;line-height:1.62;
    font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",ui-serif,Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;min-height:100dvh;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 15px calc(96px + env(safe-area-inset-bottom))}
  /* ---------- 顶部 ---------- */
  .top{padding:calc(20px + env(safe-area-inset-top)) 2px 8px}
  .brand{display:flex;align-items:center;gap:11px}
  .seal{
    width:38px;height:38px;flex:0 0 38px;border-radius:7px;background:var(--red);
    color:#fff8ee;display:grid;place-items:center;font-size:20px;line-height:1;
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);letter-spacing:0
  }
  .brand h1{margin:0;font-size:19px;font-weight:600;letter-spacing:2px}
  .brand p{margin:0;font-size:11px;color:var(--ink3);letter-spacing:.6px}
  .datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px;position:relative}
  .datepick{
    position:absolute;left:44px;right:44px;top:-2px;bottom:-2px;width:calc(100% - 88px);
    opacity:0;border:0;background:transparent;cursor:pointer;font-size:16px;color:transparent
  }
  .navbtn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    color:var(--ink2);font-size:17px;line-height:1;display:grid;place-items:center;cursor:pointer;
    transition:.18s
  }
  .navbtn:active{transform:scale(.94);background:#fff}
  .datebox{flex:1;text-align:center;min-width:0}
  .dmain{font-size:26px;font-weight:600;letter-spacing:1px;line-height:1.15;font-variant-numeric:tabular-nums}
  .dmain .u{font-size:12px;color:var(--ink3);margin:0 3px}
  .dsub{font-size:11.5px;color:var(--ink2);margin-top:3px;letter-spacing:.3px}
  .dsub .gz{color:var(--red);font-weight:600}
  .live{margin-top:13px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .pill{
    font-size:11.5px;color:var(--ink2);background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;letter-spacing:.3px;white-space:nowrap
  }
  .pill b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .pill.now{background:var(--red);border-color:var(--red);color:#fff6ec}
  .pill.now b{color:#fff}
  .progress{height:2px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--gold));width:0;transition:width .5s}
  /* ---------- 通用 ---------- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:15px 15px 14px;margin-top:12px;box-shadow:var(--shadow)
  }
  .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
  .hd h3{margin:0;font-size:15px;font-weight:600;letter-spacing:1px}
  .hd .sub{font-size:10px;color:var(--red);letter-spacing:.3px;font-weight:500;background:var(--redsoft);
    padding:2px 8px;border-radius:999px;white-space:nowrap}
  .hd h3 em{font-style:normal;color:var(--ink3);font-size:11px;margin-left:6px;letter-spacing:.5px}
  .muted{color:var(--ink2)}
  .tiny{font-size:11px;color:var(--ink3);line-height:1.55}
  .tag{
    display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:6px;background:#f3ecdd;
    color:var(--ink2);margin:0 4px 4px 0;letter-spacing:.3px;white-space:nowrap
  }
  .tag.red{background:var(--redsoft);color:var(--red)}
  .tag.jade{background:#e8f0ea;color:var(--jade)}
  .tag.gold{background:#f6efdd;color:#8a6a33}
  /* ---------- 顶层摘要 ---------- */
  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}
  .sitem{
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px 7px;
    text-align:center;box-shadow:var(--shadow);min-width:0
  }
  .sitem .k{font-size:10px;color:var(--ink3);letter-spacing:.5px;display:block}
  .sitem .v{font-size:14.5px;font-weight:600;letter-spacing:.5px;display:block;line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sitem .v.off{color:var(--ink3);font-size:12.5px;font-weight:400}
  /* ---------- 分区标题 ---------- */
  .sechead{display:flex;align-items:center;gap:8px;margin:18px 2px 0;font-size:11.5px;
    letter-spacing:2px;color:var(--red);font-weight:600}
  .sechead i{display:block;width:15px;height:2px;border-radius:2px;background:var(--red)}
  .sechead span{margin-left:auto;font-size:10.5px;letter-spacing:.4px;color:var(--ink3);font-weight:400}
  .sechead + .card,.sechead + .hero{margin-top:8px}
  /* ---------- 时辰 chips ---------- */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-top:14px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;
    padding:5px 9px;font-size:12px;color:var(--ink2);cursor:pointer;text-align:center;transition:.16s;
    line-height:1.25;font-variant-numeric:tabular-nums
  }
  .chip small{display:block;font-size:9.5px;color:var(--ink3);letter-spacing:.2px}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff8ee}
  .chip.on small{color:rgba(255,248,238,.62)}
  .chip.cur:not(.on){border-color:var(--red);color:var(--red)}
  /* ---------- 灵龟 hero ---------- */
  .hero{
    position:relative;overflow:hidden;
    background:linear-gradient(160deg,#fffdf7 0%,#fdf6ea 100%);
    border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;margin-top:2px;
    box-shadow:var(--shadow)
  }
  .hero::after{
    content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(168,64,47,.07),rgba(168,64,47,0) 70%);pointer-events:none
  }
  .hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .hero-top .lab{font-size:11.5px;letter-spacing:2px;color:var(--red);font-weight:600}
  .hero-top .gua{font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:#fff}
  .hero-body{display:flex;align-items:flex-end;gap:12px;margin-top:6px}
  .hero-acu{font-size:40px;line-height:1.05;font-weight:600;letter-spacing:3px;color:var(--ink)}
  .hero-acu.small{font-size:27px;letter-spacing:1.5px}
  .hero-meta{font-size:11.5px;color:var(--ink2);line-height:1.5;padding-bottom:5px}
  .hero-meta b{color:var(--jade);font-weight:600}
  .calc{
    margin-top:11px;background:#fbf5e8;border:1px dashed #e2d6bf;border-radius:10px;
    padding:8px 10px;font-size:11.5px;color:var(--ink2);line-height:1.6;font-variant-numeric:tabular-nums
  }
  .calc b{color:var(--ink);font-weight:600}
  .calc .res{color:var(--red);font-weight:600}
  /* 九宫 */
  .grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:12px}
  .cell{
    background:#fffdf7;border:1px solid var(--line);border-radius:10px;padding:7px 2px 6px;
    text-align:center;position:relative;transition:.2s
  }
  .cell .n{position:absolute;left:5px;top:3px;font-size:9px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .cell .g{font-size:9.5px;color:var(--ink3);letter-spacing:.5px}
  .cell .a{display:block;font-size:12.5px;letter-spacing:.5px;margin-top:1px}
  .cell.on{background:var(--red);border-color:var(--red);box-shadow:0 6px 14px -8px rgba(168,64,47,.8)}
  .cell.on .n,.cell.on .g{color:rgba(255,246,236,.7)}
  .cell.on .a{color:#fff;font-weight:600}
  /* ---------- 行样式 ---------- */
  .kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-top:1px solid #f0e9db}
  .kv:first-of-type{border-top:0}
  .kv .k{font-size:12px;color:var(--ink2);flex:0 0 auto}
  .kv .v{font-size:13px;text-align:right;font-weight:500;min-width:0}
  .kv .v b{font-weight:600;letter-spacing:.5px}
  .kv .v em{font-style:normal;font-size:10.5px;color:var(--ink3);display:block;font-weight:400;letter-spacing:.2px}
  .bigline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 4px}
  .bigline .acu{font-size:23px;font-weight:600;letter-spacing:1.5px}
  .bigline .mer{font-size:11.5px;color:var(--ink2)}
  .note{margin-top:9px;font-size:11px;color:var(--ink3);line-height:1.6;border-left:2px solid var(--line);padding-left:8px}
  .note.warn{border-left-color:var(--red2);color:#9a6a5c}
  /* ---------- 全日表 ---------- */
  .daylist{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .drow{padding:10px 13px;border-top:1px solid #f1eadc;cursor:pointer;transition:.15s;position:relative}
  .drow:first-child{border-top:0}
  .drow:active{background:#fbf6ea}
  .drow.on{background:linear-gradient(90deg,#fdf1ec,#fffdf7 70%)}
  .drow.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
  .dtop{display:flex;align-items:baseline;gap:8px}
  .dtop .sh{font-size:13.5px;font-weight:600;letter-spacing:1px}
  .dtop .rg{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .dtop .gzp{font-size:12px;color:var(--red);font-weight:600;margin-left:auto;letter-spacing:.5px}
  .dtop .badge{font-size:9px;background:var(--red);color:#fff;border-radius:4px;padding:1px 5px;margin-left:6px;letter-spacing:.5px}
  .dbt{margin-top:3px;font-size:11.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 10px}
  .dbt span b{color:var(--ink);font-weight:600}
  .dbt span i{font-style:normal;color:var(--ink3);font-size:10px}
  /* ---------- 运气 ---------- */
  .yearcard{background:linear-gradient(160deg,#fffdf7,#f8f1e2);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-top:14px}
  .yearcard .yt{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .yearcard .ygz{font-size:25px;font-weight:600;letter-spacing:2px}
  .yearcard .yx{font-size:12px;color:var(--ink2)}
  .yunrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .ybox{background:#fffefa;border:1px solid var(--line);border-radius:11px;padding:9px 10px}
  .ybox .k{font-size:10px;color:var(--ink3);letter-spacing:.8px;display:block}
  .ybox .v{font-size:14px;font-weight:600;letter-spacing:.5px;display:block;margin-top:1px}
  .ybox .d{font-size:10px;color:var(--ink3);display:block;margin-top:1px;font-weight:400}
  .stepline{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
  .sdot{text-align:center;font-size:9.5px;color:var(--ink3);padding:5px 0;border-radius:7px;border:1px solid transparent;line-height:1.3}
  .sdot b{display:block;font-size:11px;color:var(--ink2);font-weight:600}
  .sdot.on{background:var(--redsoft);border-color:#eccfc5;color:var(--red)}
  .sdot.on b{color:var(--red)}
  table.tb{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:4px}
  table.tb th{font-weight:500;color:var(--ink3);font-size:10px;letter-spacing:.5px;text-align:left;padding:5px 3px;border-bottom:1px solid var(--line)}
  table.tb td{padding:6px 3px;border-bottom:1px solid #f2ecdf;vertical-align:top;line-height:1.45}
  table.tb tr:last-child td{border-bottom:0}
  table.tb tr.hi td{background:#fdf1ec}
  table.tb .stepn{color:var(--ink3);font-size:10px}
  table.tb b{font-weight:600}
  /* ---------- 说明 ---------- */
  .info h4{margin:13px 0 5px;font-size:13px;font-weight:600;letter-spacing:.8px}
  .info p{margin:4px 0;font-size:12.5px;color:var(--ink2);line-height:1.72}
  .info .song{
    background:#fbf5e8;border:1px dashed #e2d6bf;border-radius:10px;padding:9px 11px;margin:6px 0;
    font-size:12px;line-height:1.9;color:#6c6355;letter-spacing:.4px
  }
  /* ---------- 原文经典 ---------- */
  .src{border-top:1px solid #f0e9db;padding:10px 0;line-height:1.7}
  .src:first-of-type{border-top:0}
  .src summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:4px 0;list-style:none;display:flex;align-items:center;gap:6px;user-select:none}
  .src summary::-webkit-details-marker{display:none}
  .src summary b{color:var(--red);font-weight:600}
  .src summary::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--red2);display:inline-block;transition:.2s;margin-right:2px;flex:0 0 auto}
  .src[open] summary::before{transform:rotate(90deg);background:var(--red)}
  .src[open] summary{color:var(--ink);border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:8px}
  .src .song{font-size:11.5px;line-height:1.95}
  .src .tiny{margin-top:4px}
  /* ---------- 诸法（新增五系） ---------- */
  .seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 2px;margin-top:12px;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .sbtn{
    flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:9px;
    padding:5px 10px;font-family:inherit;font-size:12px;color:var(--ink2);cursor:pointer;
    letter-spacing:.3px;transition:.16s
  }
  .sbtn.on{background:var(--ink);border-color:var(--ink);color:#fff8ee}
  .pt{border-top:1px solid #f0e9db;padding:9px 0}
  .pt:first-of-type{border-top:0}
  .pt .nm{font-size:13px;font-weight:600;letter-spacing:.5px;display:flex;align-items:baseline;gap:6px}
  .pt .nm em{font-style:normal;font-size:10px;font-weight:400;color:var(--ink3);letter-spacing:.2px}
  .pt .loc{font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.62}
  .pt .ind{font-size:11px;color:var(--red);margin-top:3px;line-height:1.55;letter-spacing:.2px}
  .pt .needle{font-size:10.5px;color:var(--jade);margin-top:3px;line-height:1.55;letter-spacing:.2px}
  .pt .nm .nnum{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;background:#b84430;color:#fff;font-size:10.5px;font-weight:600;line-height:1;flex:0 0 auto}
  .diabox{background:#fbf6ea;border:1px solid #e8ddc6;border-radius:12px;padding:8px 8px 6px;margin:6px 0 10px}
  .diabox .dia{margin:0}
  /* 董氏奇穴：部位导航 + 双图切换 */
  .pnav{display:flex;gap:6px;overflow-x:auto;padding:9px 0 5px;margin:0 -2px;scrollbar-width:none;
        position:sticky;top:0;z-index:6;background:linear-gradient(180deg,var(--paper) 72%,rgba(244,239,228,.86) 96%,rgba(244,239,228,0))}
  .pnav::-webkit-scrollbar{display:none}
  #panelMore .card[id^="tung"]{scroll-margin-top:46px}
  .pchip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;
         padding:4px 11px;font-family:inherit;font-size:11.5px;color:var(--ink2);cursor:pointer;letter-spacing:.3px}
  .pchip:active{background:var(--redsoft);border-color:var(--red2);color:var(--red)}
           overflow:hidden;background:var(--card)}
        color:var(--ink2);cursor:pointer;letter-spacing:.3px}
  .bookplate{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px;margin:8px 0 6px}
  .bookplate img{width:100%;height:auto;display:block;border-radius:6px;cursor:zoom-in}
  .bookplate .cap{font-size:10px;color:var(--ink3);text-align:center;margin-top:6px;letter-spacing:.2px}
  .zoom{position:fixed;inset:0;z-index:60;background:rgba(24,20,14,.93);display:none;
        align-items:center;justify-content:center;padding:14px}
  .zoom.on{display:flex}
  .zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px;padding:6px}
  .pt.hi{background:#fdf1ec;margin:0 -9px;padding:9px 9px;border-radius:9px;border-top-color:transparent}
  .ring{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:9px}
  .rz{
    text-align:center;font-size:10.5px;padding:5px 1px;border:1px solid var(--line);
    border-radius:8px;background:#fffdf7;color:var(--ink2);line-height:1.3
  }
  .rz small{display:block;font-size:9px;color:var(--ink3);letter-spacing:0}
  .rz.on{background:var(--red);border-color:var(--red);color:#fff}
  .rz.on small{color:rgba(255,246,236,.72)}
  table.tb.wu td{padding:5px 2px;font-size:10.5px}
  table.tb.wu th{padding:5px 2px;font-size:9.5px}
  table.tb.wu td.mn{font-weight:600;white-space:nowrap}
  table.tb.nztb td{padding:5px 2px;font-size:10.5px;white-space:nowrap}
  table.tb.nztb th{font-size:9px;padding:4px 2px;line-height:1.3}
  table.tb.nztb td i{display:block;font-style:normal;font-size:8.5px;color:var(--ink3)}
  table.tb.nztb td.tm{color:var(--jade);font-weight:600}
  table.tb.nztb tr.on td{background:var(--redsoft)}
  table.tb.nztb tr.on td:first-child{box-shadow:inset 3px 0 0 var(--red)}
  /* ---------- 关于（仿设置页） ---------- */
  .about{margin-top:2px}
  .about .row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 2px;border-bottom:1px solid #f2ecdf;font-size:13px}
  .about .row:last-child{border-bottom:0}
  .about .k{color:var(--ink);letter-spacing:.3px}
  .about .v{color:var(--ink2);text-align:right;word-break:break-all;text-decoration:none;font-variant-numeric:tabular-nums}
  .about a.v{color:var(--jade);border-bottom:1px dashed var(--line)}
  .about .arrow{border:0;background:none;font-size:19px;line-height:1;color:var(--ink3);cursor:pointer;padding:0 2px}
  ul.rel{margin:6px 0 0;padding-left:16px}
  ul.rel li{font-size:11.5px;color:var(--ink2);line-height:1.65;margin:3px 0}
  .rules p{margin:7px 0;font-size:12px;line-height:1.68;color:var(--ink2)}

/* ---- 儒略日 ---- */
function jdn(y, m, d){
  const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
  return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4)
       - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
}
function toJd(y, m, d, h = 0, mi = 0){
  return Date.UTC(y, m - 1, d, h, mi) / 86400000 + 2440587.5 - 8 / 24;
}
function fromJd(jd){
  const t = Math.round((jd - 2440587.5) * 86400000 + 8 * 3600000);
  const dt = new Date(t);
  return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate(),
           h: dt.getUTCHours(), mi: dt.getUTCMinutes() };
}

/* ---- 太阳视黄经（Meeus 低精度，误差约 0.01°）---- */
function sunLon(jd){
  const T = (jd - 2451545.0) / 36525;
  const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  const M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * Math.PI / 180;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M)
          + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
  const om = (125.04 - 1934.136 * T) * Math.PI / 180;
  const lam = L0 + C - 0.00569 - 0.00478 * Math.sin(om);
  return ((lam % 360) + 360) % 360;
}
const TERM_DEFS = [
  ['小寒',285,1,6],['大寒',300,1,20],['立春',315,2,4],['雨水',330,2,19],

  const g = jd => ((sunLon(jd) - lon + 540) % 360) - 180;
  let lo = toJd(y, mApprox, dApprox) - 12, hi = toJd(y, mApprox, dApprox) + 12;

  while (!(g(lo) < 0 && g(hi) > 0) && guard++ < 8){ lo -= 5; hi += 5; }
  for (let i = 0; i < 58; i++){
    const mid = (lo + hi) / 2;
    if (g(mid) < 0) lo = mid; else hi = mid;

  const key = y + ':' + lon;

}

  const key = 'all' + y;
  if (_termCache[key]) return _termCache[key];
  const arr = TERM_DEFS.map(([name, lon]) => ({ name, lon, jd: termJd(y, lon) }));
  arr.sort((a, b) => a.jd - b.jd);

function currentTerm(y, m, d, h = 12){
  const jd = toJd(y, m, d, h);
  const pool = [...termsOf(y - 1), ...termsOf(y), ...termsOf(y + 1)];
  let cur = pool[0], next = pool[1];
  for (let i = 0; i < pool.length; i++){
    if (pool[i].jd <= jd){ cur = pool[i]; next = pool[i + 1]; }
  }
  return { cur, next };
}

/* ---- 干支 ---- */
function dayGzIndex(y, m, d){ return (((jdn(y, m, d) + 49) % 60) + 60) % 60; }

  const yy = ganZhiYear(y, m, d, h);

/* 运气年：以大寒为岁首 */
function luckYear(y, m, d, h = 12){
  const jd = toJd(y, m, d, h);
  return jd < termJd(y, 300) ? y - 1 : y;
}
function luckData(y, m, d, h = 12){
  const ly = luckYear(y, m, d, h);
  const yidx = yearGzIndex(ly);
  const yg = yidx % 10, yz = yidx % 12;
  const yunWx = GAN_WX[yg % 5];
  const tai = yg % 2 === 0;
  const sitian = SITIAN_ZHI[yz], zaiquan = ZAIQUAN_ZHI[yz];
  const sIdx = LIUQI_ORDER.indexOf(sitian);
  const keqi = [];
  for (let k = 0; k < 6; k++) keqi.push(LIUQI_ORDER[((sIdx + k - 2) % 6 + 6) % 6]);

  // 六步时间
  const steps = [];
  const bounds = [];
  for (let k = 0; k < 7; k++){
    const yy = k === 6 ? ly + 1 : ly;
    bounds.push(termJd(yy, STEP_LON[k]));
  }
  const jd = toJd(y, m, d, h);
  let curStep = 0;
  for (let k = 0; k < 6; k++) if (jd >= bounds[k]) curStep = k;
  for (let k = 0; k < 6; k++){
    const rel = relation(LIUQI_WX[keqi[k]], LIUQI_WX[ZHUQI[k]]);
    steps.push({ k, name: STEP_NAME[k], zhuqi: ZHUQI[k], keqi: keqi[k], rel,
                 start: bounds[k], end: bounds[k + 1],
                 active: k === curStep && jd < bounds[k + 1] });
  }

  // 五运（主运 / 客运）
  const dahan = termJd(ly, 300);
  const yunStart = dahan;
  const zhuYun = YUN_WX.map((wx, k) => ({ wx, tai: null,
      start: yunStart + k * STEP_DAYS, end: yunStart + (k + 1) * STEP_DAYS }));
  const startIdx = YUN_WX.indexOf(yunWx);
  const keYun = [];
  for (let k = 0; k < 5; k++){
    keYun.push({ wx: YUN_WX[(startIdx + k) % 5], tai: (k % 2 === 0) ? tai : !tai,
      start: yunStart + k * STEP_DAYS, end: yunStart + (k + 1) * STEP_DAYS,
      active: jd >= yunStart + k * STEP_DAYS && jd < yunStart + (k + 1) * STEP_DAYS });
  }
  // 格局
  const yunWxNow = yunWx, sitianWx = LIUQI_WX[sitian], zaiquanWx = LIUQI_WX[zaiquan];
  const zhiWx = ZHI_WX[yz];
  const geju = [];
  if (yunWxNow === sitianWx) geju.push({ t:'天符', n:'岁运与司天同气' });
  if (yunWxNow === zhiWx) geju.push({ t:'岁会', n:'岁运与年支五行相同' });
  if (yunWxNow === sitianWx && yunWxNow === zhiWx) geju.push({ t:'太乙天符', n:'天符又逢岁会' });
  if (tai && yunWxNow === zaiquanWx) geju.push({ t:'同天符', n:'太过之年，岁运与在泉同气' });
  if (!tai && yunWxNow === zaiquanWx) geju.push({ t:'同岁会', n:'不及之年，岁运与在泉同气' });

  return {
    ly, yidx, yearName: gzName(yidx), yg, yz,
    yunWx, tai, yunName: yunWx + '运' + (tai ? '太过' : '不及'),
    sitian, zaiquan, keqi, steps, curStep,
    zhuYun, keYun, geju, dahan
  };
}

/* 固定按 UTC+8 换算，不依赖设备时区；用 getUTC* 读取即为北京钟表时间 */
function nowParts(){
  const ms = Date.now() + 480 * 60000;
  const dt = new Date(ms);
  return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate(),
           h: dt.getUTCHours(), mi: dt.getUTCMinutes(), w: dt.getUTCDay() };
}

function sameDate(a, b){ return a.y === b.y && a.m === b.m && a.d === b.d; }
function isToday(){ const n = nowParts(); return sameDate(state, n); }

function setDate(y, m, d){
  state.y = y; state.m = m; state.d = d;
  state.rows = null;
  refreshAll();
}

/* ---- 计算当日 12 时辰 ---- */
function buildRows(){
  const dgIdx = dayGzIndex(state.y, state.m, state.d);
  const dg = { idx: dgIdx, g: dgIdx % 10, z: dgIdx % 12, name: gzName(dgIdx) };
  const rows = [];
  for (let hi = 0; hi < 12; hi++){
    const hg = hourGz(dg.g, hi);
    rows.push({
      hi, hg,
      lg: lingGui(dgIdx, hi),
      ft: feiTeng(hg.g),
      nj: naJia(dg.g, hi),
      pt: naJiaPartner(dg.g, hi),
      nz: naZi(hi)
    });
  }
  state.dg = dg;
  state.rows = rows;
  return rows;
}
function ensure(){
  if (!state.rows) buildRows();
  return state.rows;
}

function svgEye(curK, left){
  const CX = 170, CY = 152, R = 118, r = 46;
  const items = [
    { k:1, gua:'乾', a:45,  org:'肺·大肠' },
    { k:2, gua:'坎', a:90,  org:'肾·膀胱' },
    { k:3, gua:'艮', a:135, org:'上焦' },
    { k:4, gua:'震', a:180, org:'肝·胆' },
    { k:5, gua:'巽', a:225, org:'中焦' },
    { k:6, gua:'离', a:270, org:'心·小肠' },
    { k:7, gua:'坤', a:315, org:'脾·胃' },
    { k:8, gua:'兑', a:0,   org:'下焦' }
  ];
  const A = a => left ? 180 - a : a;                 // 左右眼镜像
  const P = (ang, rad) => [
    (CX + rad * Math.cos(ang * Math.PI / 180)).toFixed(1),
    (CY - rad * Math.sin(ang * Math.PI / 180)).toFixed(1)
  ];
  let out = '<svg class="dia" viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg">' +
    '<text x="170" y="18" text-anchor="middle" style="font-size:10px">' +
    (left ? '右眼（外眦在左）' : '左眼（外眦在右）') + ' · 正面观</text>';
  items.forEach(it => {
    const c = A(it.a), a1 = c - 22.5, a2 = c + 22.5, on = it.k === curK;
    let d = 'M ' + P(a1, R).join(' ');
    for (let a = a1 + 4; a <= a2; a += 4) d += ' L ' + P(a, R).join(' ');
    d += ' L ' + P(a2, r).join(' ');
    for (let a = a2 - 4; a >= a1; a -= 4) d += ' L ' + P(a, r).join(' ');
    d += ' Z';
    out += '<path d="' + d + '" fill="' + (on ? '#b84430' : '#fffdf7') +
      '" stroke="#e0d3bb" stroke-width="1"/>';
    const lp = P(c, 100), t2 = P(c, 76);
    out += '<text x="' + lp[0] + '" y="' + lp[1] + '" text-anchor="middle" class="num" fill="' +
      (on ? '#fff' : '#8c2e1e') + '">' + it.k + '区 ' + it.gua + '</text>';
    out += '<text x="' + t2[0] + '" y="' + (parseFloat(t2[1]) + 10) + '" text-anchor="middle" fill="' +
      (on ? 'rgba(255,255,255,.88)' : '#6b5c3e') + '" style="font-size:8.5px">' + it.org + '</text>';
  });
  out += '<circle cx="' + CX + '" cy="' + CY + '" r="' + r + '" fill="#f7efe0" stroke="#d8c9ad" stroke-width="1.2"/>' +
    '<circle cx="' + CX + '" cy="' + CY + '" r="21" fill="#6b5c3e" opacity=".16"/>' +
    '<text x="' + CX + '" y="' + (CY + 4) + '" text-anchor="middle" style="font-size:9px" fill="#6b5c3e">瞳孔</text>' +
    '<text x="' + CX + '" y="26" text-anchor="middle" style="font-size:9px">上</text>' +
    '<text x="' + CX + '" y="290" text-anchor="middle" style="font-size:9px">下</text>' +
    '<text x="' + (left ? 308 : 34) + '" y="' + (CY + 4) + '" text-anchor="middle" style="font-size:9px">内</text>' +
    '<text x="' + (left ? 34 : 308) + '" y="' + (CY + 4) + '" text-anchor="middle" style="font-size:9px">外</text>' +
    '</svg>';
  return out;
}

    '<div class="card" style="margin-top:14px">' +
      '<div class="hd"><h3>当令经 · ' + w.mer + '经</h3>' +
        '<span class="sub">' + ZHI[state.hi] + '时当令 · 五行属' + w.wx + '</span></div>' +
      pts +
      '<div class="kv" style="border-top:2px solid var(--line);margin-top:4px"><span class="k">虚证 · 补其母（' +
        w.motherWx + '）</span><span class="v"><b>' + w.mother[0] + '</b><em>' + w.mother[2] + '穴</em></span></div>' +
      '<div class="kv"><span class="k">实证 · 泻其子（' + w.childWx + '）</span><span class="v"><b>' +
        w.child[0] + '</b><em>' + w.child[2] + '穴</em></span></div>' +
      '<div class="kv"><span class="k">原穴</span><span class="v"><b>' + w.yuan + '</b></span></div>' +
    '</div>';

  const ruleCard =
    '<div class="card"><div class="hd"><h3>五输穴主治与补泻</h3><span class="sub">《灵枢》《难经》</span></div>' +
      '<div class="song">所出为井，所溜为荥，所注为输，所行为经，所入为合。<br><br>' +
      '井主心下满，荥主身热，输主体重节痛，<br>经主喘咳寒热，合主逆气而泄。</div>' +
      '<div class="kv"><span class="k">阴经五行序</span><span class="v">井木 → 荥火 → 输土 → 经金 → 合水</span></div>' +
      '<div class="kv"><span class="k">阳经五行序</span><span class="v">井金 → 荥水 → 输木 → 经火 → 合土</span></div>' +
      '<div class="note">「虚则补其母，实则泻其子」：以本经五行定母子。如肺属金，金之母为土（太渊），' +
      '金之子为水（尺泽）——虚补太渊、实泻尺泽。亦可按纳子法当令经随时取用。</div>' +
    '</div>';

  const rows = WUSHU_ORDER.map(mer => {
    const info = WUSHU[mer], on = mer === w.mer;
    return '<tr class="' + (on ? 'hi' : '') + '"><td class="mn">' + mer + '</td>' +
      info.pts.map(p => '<td>' + p[0] + '<br><span class="stepn">' + p[1] + '</span></td>').join('') +
      '</tr>';
  }).join('');
  const tableCard =
    '<div class="card"><div class="hd"><h3>十二经五输穴</h3><span class="sub">十二经 · 六十穴</span></div>' +
      '<table class="tb wu"><thead><tr><th>经</th><th>井</th><th>荥</th><th>输</th><th>经</th><th>合</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
      '<div class="note">穴下小字为该穴五行属性。高亮行为本时辰当令经（纳子法）。</div>' +
    '</div>';

  return heroCard + ruleCard + tableCard;
}

      '<div class="tiny" style="margin-top:2px">下图为焦氏头皮针体系图（图 14），点按可全屏放大；十五刺激区定位见下方列表。</div>' +
      '<div class="kv"><span class="k">进针角度</span><span class="v">针身与头皮成 15°–30°，沿帽状腱膜下层刺入 1–1.5 寸</span></div>' +

        '<img class="zoomable" data-zoom="scalp" src="' + SCALP_IMG + '" alt="焦氏头皮针体系">' +

  const list =

        '<div class="pt"><div class="nm">' + s.n + '<em>' + s.sub + '</em></div>' +

      '<div class="note warn">头皮针须由执业医师操作。婴幼儿囟门未闭者禁针；高血压、出血倾向、' +
      '头皮感染或颅骨缺损区慎用或禁用。</div>' +
    '</div>';

  return intro + list;
}

function moreEye(){

  const ctl =
    '<div class="seg" style="margin:9px 0 0">' +
      '<button class="sbtn' + (state.eyeL ? '' : ' on') + '" data-eye="L">左眼（外眦在右）</button>' +
      '<button class="sbtn' + (state.eyeL ? ' on' : '') + '" data-eye="R">右眼（外眦在左）</button>' +
    '</div>';

  const hero =
    '<div class="card" style="margin-top:14px">' +
      '<div class="hd"><h3>眼针 · 八区十三穴</h3><span class="sub">彭静山 · 观眼识病</span></div>' +
      '<div class="tiny">以瞳孔为中心，作水平线、垂直线与两条对角线，将眼眶周围分为八区，每区 45°。' +
      '<b>内＝鼻侧内眦，外＝颞侧外眦</b>；图为正面观，故<b>患者右眼的外眦在图像左侧</b>、' +
      '左眼的外眦在图像右侧，双眼互为镜像。八区以「内 / 外 / 上 / 下」定位，' +
      '换眼时方位不变、左右互换，取穴前先确认患眼。</div>' +
      ctl +
      svgEye(curK, !!state.eyeL) +
      '<div class="note">红色区为此刻当令经（' + ZHI[state.hi] + '时 · ' + hiMer + '经）所对应之区，可作随时取穴参考。</div>' +
    '</div>';

  const detail =
    '<div class="card"><div class="hd"><h3>八区定位与主治</h3><span class="sub">按区序排列</span></div>' +
      EYE.map(e =>
        '<div class="pt' + (e.k === curK ? ' hi' : '') + '"><div class="nm">' + e.k + '区 · ' + e.gua +
        '<em>' + e.pos + '</em></div>' +
        '<div class="loc">所属：' + e.org.join('、') + '</div>' +
        '<div class="ind">' + eyeInd(e.org) + '</div></div>').join('') +

  const tech =
    '<div class="card"><div class="hd"><h3>观眼识病与操作</h3></div>' +
      '<div class="kv"><span class="k">白睛脉络</span><span class="v">怒张、曲张、分叉、垂露、黑点——辨病之位</span></div>' +
      '<div class="kv"><span class="k">脉络色泽</span><span class="v">鲜红多新病热证，紫红多瘀，暗灰多虚寒</span></div>' +
      '<div class="kv"><span class="k">取穴三法</span><span class="v">循经取穴 · 看眼取穴 · 三焦取穴</span></div>' +
      '<div class="kv"><span class="k">进针</span><span class="v">距眶缘约 2 分处，沿皮下平刺或斜刺 0.5–1 寸</span></div>' +
      '<div class="kv"><span class="k">手法</span><span class="v">不提插、不捻转，留针 5–15 分钟</span></div>' +
      '<div class="note warn">眼区血管丰富，须由执业医师操作；眼部感染、急性青光眼、' +
      '眶内占位及出血性疾病禁针。</div>' +
    '</div>';

  return hero + detail + tech;
}
function eyeInd(org){
  if (org.includes('上焦')) return '心肺疾患、胸闷、心悸、咳喘、头面病';
  if (org.includes('中焦')) return '脾胃肝胆疾患、脘腹胀满、呕恶';
  if (org.includes('下焦')) return '肾与膀胱、腰骶、下肢、二便及妇科疾患';
  const map = {
    肺:'咳喘、胸闷、皮肤病', 大肠:'便秘、泄泻、肠鸣', 肾:'腰痛、耳鸣、水肿、遗尿',
    膀胱:'尿频、尿急、腰痛', 肝:'胁痛、眩晕、目疾、情志病', 胆:'口苦、胁痛、偏头痛',
    心:'心悸、失眠、胸痛', 小肠:'腹痛、腹泻、小便不利', 脾:'腹胀、食少、乏力、水肿',
    胃:'胃痛、呕吐、消化不良'
  };
  return org.map(o => map[o] || '').filter(Boolean).join(' · ');
}

      '<div class="tiny">脐周按十二地支配位（子下、午上、卯左、酉右），八卦纳支：坎子、艮丑寅、震卯、' +
      '巽辰巳、离午、坤未申、兑酉、乾戌亥。小字为所属卦位。</div>' +
      '<div class="ring">' + ring + '</div>' +
      '<div class="note">高亮为此刻时辰。脐针时间针法即依此「因时取位」，与子午流注同一思路而取位不同。</div>' +
    '</div>';

  const theory =
    '<div class="card"><div class="hd"><h3>四大理论与操作</h3></div>' +
      '<div class="kv"><span class="k">脐易学</span><span class="v">先后天八卦、洛书九宫定位</span></div>' +
      '<div class="kv"><span class="k">脐中医</span><span class="v">神阙属任脉，为先天之结蒂、后天之气舍</span></div>' +
      '<div class="kv"><span class="k">脐全息</span><span class="v">脐洛书全息、脐十二地支全息</span></div>' +
      '<div class="kv"><span class="k">脐时间</span><span class="v">脐与时辰相应，因时取位</span></div>' +
      '<div class="kv"><span class="k">进针</span><span class="v">脐壁（脐缘）斜刺，针尖指向脐心，深 0.5–1 寸</span></div>' +
      '<div class="kv"><span class="k">用针</span><span class="v">常一至三针，留针 30–55 分钟</span></div>' +
      '<div class="note warn">孕妇、脐部感染或湿疹、腹部术后未愈、腹水、腹膜炎、' +
      '腹腔肿瘤及急腹症者禁针。</div>' +
    '</div>';

  return hero + zodiac + theory;
}

let SIDX = null;
function buildSearchIndex(){
  const idx = [];
  WUSHU_ORDER.forEach(mer => {
    const info = WUSHU[mer];
    info.pts.forEach(p => idx.push({
      t: p[0], s: mer + '经 · ' + p[2] + '穴 · 属' + p[1] + '（' + NANJING68[p[2]] + '）',
      tag: '五腧穴', tab: 'more', more: 'wushu'
    }));
    idx.push({ t: mer + '经 · 原穴', s: info.yuan + ' · 五行属' + info.wx,
               tag: '五腧穴', tab: 'more', more: 'wushu' });
  });
  SCALP.forEach(s => idx.push({ t: s.n, s: s.loc + ' — ' + s.ind, tag: '头皮针', tab: 'more', more: 'scalp' }));
  EYE.forEach(e => idx.push({
    t: e.k + '区 · ' + e.gua, s: e.pos + ' · ' + e.org.join('、') + ' — ' + eyeInd(e.org),
    tag: '眼针', tab: 'more', more: 'eye'
  }));
  NAVEL_BAGUA.forEach(b => idx.push({
    t: '脐 ' + b.gua + ' 位', s: '洛书 ' + b.num + ' · ' + b.wx + ' · 应 ' + b.zhi + ' · ' + b.pos,
    tag: '脐针', tab: 'more', more: 'navel'
  }));
  TUNG.forEach(g => g.list.forEach(c => idx.push({
    t: c.n, s: (c.loc || '定位见原书') + ' — ' + c.ind + (c.needle ? '（' + c.needle + '）' : ''),
    tag: '董氏' + g.part.split(' ')[0], tab: 'more', more: 'tung'
  })));
  TUNG_TECH.forEach(t => idx.push({ t: t.n, s: t.d, tag: '董氏手法', tab: 'more', more: 'tung' }));
  [].forEach.call(document.querySelectorAll('#panelInfo details.src'), (d, i) => {
    const sum = d.querySelector('summary').textContent.trim();
    const body = (d.querySelector('.song') || d).textContent.replace(/\s+/g, ' ').trim();
    idx.push({ t: sum, s: body.slice(0, 96), tag: '原文', tab: 'info', open: i });
  });
  idx.push({ t: '灵龟八法 · 九宫八穴', s: '坎申脉 · 坤照海 · 震外关 · 巽足临泣 · 乾公孙 · 兑后溪 · 艮内关 · 离列缺',
             tag: '灵龟', tab: 'now' });
  idx.push({ t: '飞腾八法 · 八法配卦', s: '壬甲乾公孙 · 丙艮内关 · 戊坎足临泣 · 庚震外关 · 辛巽后溪 · 乙癸坤申脉 · 己离列缺 · 丁兑照海',
             tag: '飞腾', tab: 'now' });
  return idx;
}

function renderSearchPage(){
  $('panelSearch').innerHTML =

      '<div class="hd"><h3>全文检索</h3><span class="sub">穴名 · 病证 · 卦位 · 歌诀</span></div>' +
      '<input id="q" class="qin" type="search" placeholder="如：灵骨 / 腰痛 / 坎 / 公孙 / 晕听" ' +
        'autocomplete="off" autocorrect="off" spellcheck="false">' +
      '<div class="dle" style="margin-top:8px">可检索五输穴六十穴、头皮针十五区、眼针八区、' +

        ' 穴与手法、原文经典 ' + document.querySelectorAll('#panelInfo details.src').length +
        ' 条。点结果直达对应页面。</div>' +
    '</div>' +
    '<div id="sresBox"><div class="empty">输入关键词开始检索</div></div>';
  if (state.q) runSearch(state.q);
}

function runSearch(q){
  state.q = q;
  const box = $('sresBox');
  if (!box) return;
  const key = q.trim().toLowerCase();
  if (!key){ box.innerHTML = '<div class="empty">输入关键词开始检索</div>'; return; }
  if (!SIDX) SIDX = buildSearchIndex();
  const hits = SIDX.filter(r => (r.t + ' ' + r.s + ' ' + r.tag).toLowerCase().indexOf(key) >= 0).slice(0, 60);
  if (!hits.length){
    box.innerHTML = '<div class="empty">未找到「' + q.replace(/</g, '&lt;') + '」<br>' +
      '可试：穴名（灵骨）、病证（腰痛）、卦位（坎）</div>';
    return;
  }
  box.innerHTML = '<div class="card"><div class="hd"><h3>结果</h3><span class="sub">' +
    hits.length + ' 条</span></div>' +
    hits.map((r, i) =>
      '<div class="sres" data-i="' + SIDX.indexOf(r) + '">' +
        '<div class="rt"><i>' + r.tag + '</i>' + r.t + '</div>' +
        '<div class="rs">' + r.s + '</div>' +
      '</div>').join('') + '</div>';
}

function gotoResult(i){
  const r = SIDX && SIDX[i];
  if (!r) return;
  if (r.more) state.more = r.more;
  document.querySelector('.tab[data-tab="' + r.tab + '"]').click();
  if (r.tab === 'more') renderMore();
  if (r.tab === 'info' && r.open != null){
    const ds = document.querySelectorAll('#panelInfo details.src');
    if (ds[r.open]) ds[r.open].open = true;
  }
  window.scrollTo(0, 0);
}

      '<b>丙日</b>：丙日申时少泽当，戊戌内庭治胀康，庚子三间合谷过，阳谷六气火经阳，<br>' +
      '甲辰阴陵泉土合，丙午中渚气穴相。<br><br>' +
      '<b>丁日</b>：丁日未时心少冲，己酉大都脾土逢，辛亥太渊神门穴，癸丑复溜肾水通，<br>' +
      '乙卯曲泉肝经合，丁巳大陵气穴同。<br><br>' +
      '<b>戊日</b>：戊日午时厉兑先，庚申荥穴二间选，壬戌膀胱寻束骨，冲阳土穴必还原，<br>' +
      '甲子胆经阳辅是，丙寅小海穴悠然，戊辰气纳三焦脉，经火支沟细辨看。<br><br>' +
      '<b>己日</b>：己日巳时隐白始，辛未时中鱼际取，癸酉太溪太白原，乙亥中封肝经止，<br>' +
      '丁丑心脉少海连，己卯间使气穴玄。<br><br>' +
      '<b>庚日</b>：庚日辰时商阳始，壬午膀胱通谷行，甲申临泣胆输木，合谷大肠原穴明，<br>' +
      '丙戌小肠阳谷火，戊子胃中合三里，庚寅天井气穴生。<br><br>' +
      '<b>辛日</b>：辛日卯时少商起，癸巳荥穴然谷始，乙未肝脉太冲原，丁酉灵道心经止，<br>' +
      '己亥脾脉阴陵泉，辛丑包络曲泽连。<br><br>' +
      '<b>壬日</b>：壬日寅时起至阴，甲辰侠溪胆荥寻，丙午小肠后溪输，京骨原穴阳池临，<br>' +
      '戊申胃经解溪火，庚戌大肠曲池土，壬子三焦气井金。<br><br>' +
      '<b>癸日</b>：癸日亥时井涌泉，乙丑行间穴必然，丁卯神门太溪是，己巳商丘脾经原，<br>' +
      '辛未肺经合尺泽，癸酉包络中冲连。</div></details>' +

      '<details class="src"><summary><b>子午流注·纳甲法</b> · 义（《针灸大成·论子午流注之法》）</summary>' +
      '<div class="song">子午流注者，谓刚柔相配，阴阳相合，气血循环，时穴开阖也。<br>' +
      '何以子午言之？曰：子时一刻，乃一阳之生；至午时一刻，乃一阴之生。<br>' +
      '故以子午分之而得乎中也。流者，往也；注者，住也。<br>' +
      '十二经之气血，周流灌注，随天地之运行，故有开阖。<br>' +
      '阳日阳时开阳经之穴，阴日阴时开阴经之穴。<br>' +
      '阳日逢阴时，阴日逢阳时，皆无开穴，谓之闭穴。<br>' +
      '当闭穴之时，取合日互用之穴：甲己合、乙庚合、丙辛合、丁壬合、戊癸合。</div></details>' +

      '<details class="src"><summary><b>子午流注·纳子法</b> · 十二经纳地支歌</summary>' +
      '<div class="song">肺寅大卯胃辰宫，脾巳心午小未中，<br>' +
      '胱申肾酉包络戌，亥属三焦胆子逢，<br>' +
      '丑时正当归肝治，十二经中按时同。</div>' +
      '<p class="tiny">—— 十二地支配十二经，当令之时取穴；虚补母穴、实泻子穴，原穴随用。</p></details>' +

      '<details class="src"><summary><b>五运六气</b> · 司天在泉歌（《素问·天元纪大论》）</summary>' +
      '<div class="song">子午少阴君火天，阳明燥金在泉连。<br>' +
      '丑未太阴湿土司，太阳寒水在泉边。<br>' +
      '寅申少阳相火天，厥阴风木在泉骈。<br>' +
      '卯酉阳明燥金司，少阴君火在泉前。<br>' +
      '辰戌太阳寒水天，太阴湿土在泉连。<br>' +
      '巳亥厥阴风木司，少阳相火在泉边。</div></details>' +

      '<details class="src"><summary><b>五运六气</b> · 五运起运歌</summary>' +
      '<div class="song">甲己之岁，土运统之；乙庚之岁，金运统之；<br>' +
      '丙辛之岁，水运统之；丁壬之岁，木运统之；<br>' +
      '戊癸之岁，火运统之。<br><br>' +
      '阳干为太过，阴干为不及。<br>' +
      '主运自大寒始，木火土金水各七十三日；<br>' +
      '客运随岁运而起，太少相生，五年一纪。</div>' +
      '<p class="tiny">—— 引文出自《素问·天元纪大论》，主客运起讫以大寒为岁首。</p></details>' +

      '<details class="src"><summary><b>运气格局</b> · 天符·岁会·同天符·同岁会</summary>' +
      '<div class="song">天符者，岁运与司天同气也；<br>' +
      '岁会者，岁运与年支同气也；<br>' +
      '太乙天符者，天符而又岁会也；<br>' +
      '同天符者，太过之运与在泉同气也；<br>' +
      '同岁会者，不及之运与在泉同气也。<br><br>' +
      '天符为执法，岁会为行令，太乙天符为贵人。<br>' +
      '执法者，其病速而危；行令者，其病徐而持；贵人者，其病暴而死。</div>' +
      '<p class="tiny">—— 引文出自《素问·六微旨大论》《素问·气交变大论》。</p></details>' +

      '<details class="src"><summary><b>五腧穴</b> · 经气流注与主病（《灵枢》《难经》）</summary>' +
      '<div class="song">黄帝曰：愿闻五脏六腑所出之处。<br>' +
      '岐伯曰：五脏五俞，五五二十五俞；六腑六俞，六六三十六俞。<br>' +
      '经脉十二，络脉十五，凡二十七气以上下。<br>' +
      '所出为井，所溜为荥，所注为输，所行为经，所入为合。<br><br>' +
      '——《灵枢·九针十二原》<br><br>' +
      '井主心下满，荥主身热，输主体重节痛，<br>' +
      '经主喘咳寒热，合主逆气而泄。<br><br>' +
      '——《难经·六十八难》</div>' +
      '<p class="tiny">—— 阴经井木、荥火、输土、经金、合水；阳经井金、荥水、输木、经火、合土。' +
      '虚则补其母，实则泻其子。</p></details>' +

      '<details class="src"><summary><b>近现代五系针法</b> · 出处</summary>' +
      '<div class="song">焦氏头皮针 —— 焦顺发《头针疗法》，以大脑皮层功能定位立区。<br><br>' +
      '眼针 —— 彭静山《眼针疗法》，八区十三穴，兼观白睛脉络识病。<br><br>' +
      '脐针 —— 齐永（云鹤）脐针疗法，以神阙布后天八卦、脐洛书与脐十二地支全息。<br><br>' +
      '董氏奇穴 —— 董景昌《董氏针灸正经奇穴学》，杨维杰《董氏奇穴针灸学》整理阐发。</div>' +
      '<p class="tiny">—— 以上四家皆有明确师承与专著，本程序所录仅为其常用内容节要，' +
      '定穴与手法请以原书为准。</p></details>' +
    '</div>';
}

/* ---- 刷新（按标签页惰性重绘，切页不卡） ---- */
const DIRTY = { now: 1, day: 1, yun: 1, more: 1, search: 1 };
function paint(tab){
  if (!DIRTY[tab]) return;
  if (tab === 'now') renderNow();
  else if (tab === 'day') renderDay();
  else if (tab === 'yun') renderYun();
  else if (tab === 'more') renderMore();
  else if (tab === 'search') renderSearchPage();
  DIRTY[tab] = 0;
}
function refreshAll(){
  ensure();
  renderHeader();
  DIRTY.now = DIRTY.day = DIRTY.yun = DIRTY.more = DIRTY.search = 1;
  paint(state.tab);
  $('footNote').innerHTML = '数据本地推算 · 仅供参考 · 针刺须由执业医师操作';
}

/* ---- 交互 ---- */
document.getElementById('tabbar').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b) return;
  state.tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === state.tab));
  const panelId = 'panel' + state.tab[0].toUpperCase() + state.tab.slice(1);
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === panelId));
  paint(state.tab);
  window.scrollTo(0, 0);
});

$('panelNow').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip){ state.hi = +chip.dataset.hi; state.autoHour = false; renderNow(); renderHeader(); return; }
  const card = e.target.closest('[data-goto]');
  if (card){
    const tab = card.dataset.goto;
    document.querySelector('.tab[data-tab="' + tab + '"]').click();
  }
});
$('panelDay').addEventListener('click', e => {
  const row = e.target.closest('.drow');
  if (!row) return;
  state.hi = +row.dataset.hi;
  state.autoHour = false;
  document.querySelector('.tab[data-tab="now"]').click();
  renderNow();
  renderHeader();
});
$('panelMore').addEventListener('click', e => {
  const eye = e.target.closest('[data-eye]');
  if (eye){ state.eyeL = eye.dataset.eye === 'R'; renderMore(); return; }
  const part = e.target.closest('[data-part]');
  if (part){
    const card = document.getElementById('tung' + part.dataset.part);
    document.querySelectorAll('.pchip').forEach(c => c.classList.toggle('on', c === part));
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  const zi = e.target.closest('[data-zoom]');
  if (zi){
    $('zoomImg').src = zi.src;
    $('zoom').classList.add('on');
    return;
  }
  const b = e.target.closest('.sbtn');
  if (!b) return;
  state.more = b.dataset.more;
  renderMore();
});
$('zoom').addEventListener('click', () => $('zoom').classList.remove('on'));
$('panelSearch').addEventListener('input', e => {
  if (e.target.id === 'q') runSearch(e.target.value);
});
$('panelSearch').addEventListener('click', e => {
  const r = e.target.closest('.sres');
  if (r) gotoResult(+r.dataset.i);
});

function shiftDay(n){
  const dt = new Date(Date.UTC(state.y, state.m - 1, state.d + n));
  state.pinned = true;
  state.autoHour = false;
  setDate(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
}
$('prevBtn').onclick = () => shiftDay(-1);
$('nextBtn').onclick = () => shiftDay(1);
$('datePick').addEventListener('change', e => {
  const v = e.target.value;
  if (!v) return;
  const p = v.split('-').map(Number);
  const n = nowParts();
  if (p[0] === n.y && p[1] === n.m && p[2] === n.d){
    state.pinned = false;
    state.autoHour = true;
    state.hi = hourIdxOf(n.h);
  } else {
    state.pinned = true;
    state.autoHour = false;
  }
  setDate(p[0], p[1], p[2]);
});

$('panelInfo').addEventListener('click', e => {
  if (e.target.id === 'todayBtn'){
    state.pinned = false;
    state.autoHour = true;
    const n = nowParts();
    state.hi = hourIdxOf(n.h);
    setDate(n.y, n.m, n.d);
    toast('已回到今天');
  }
  if (e.target.id === 'copyBtn'){ copyToday(); }
  if (e.target.id === 'chkVer'){ checkVersion(); }
});

function copyToday(){
  const rows = ensure();
  const r = rows[state.hi];
  const dg = state.dg;
  const lines = [
    state.y + '年' + state.m + '月' + state.d + '日 ' + dg.name + '日 ' + SHI_NAME[state.hi] + '（' + r.hg.name + '时）',
    '灵龟八法：' + r.lg.point.acu + '（' + r.lg.point.gua + '宫 ' + r.lg.rem + '，通' + r.lg.point.vessel + '）',
    '飞腾八法：' + r.ft.acu + '（' + r.ft.gua + '卦）',
    '子午流注纳甲：' + (r.nj ? r.nj.acu + '（' + MER_FULL[r.nj.mer] + '·' + r.nj.type + '）'
                              : (r.pt ? '闭穴，合日互用 ' + r.pt.acu + '（' + MER_FULL[r.pt.mer] + '）' : '闭穴')),
    '子午流注纳子：' + r.nz.mer + '经当令，补' + r.nz.mother[0] + '、泻' + r.nz.child[0] + '、原' + r.nz.yuan
  ];
  const text = lines.join('\n');
  const done = () => toast('已复制');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ toast('复制失败'); }
  document.body.removeChild(ta);
}
let toastTimer = null;
function cmpVer(a, b){
  const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
  for (let i = 0; i < 3; i++){
    if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0);
  }
  return 0;
}
async function checkVersion(){
  let latest = RELEASES.length ? RELEASES[0].v : APP_VER;
  let online = false;
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 5000);
    const r = await fetch(SITE_URL.replace(/\/$/, '') + '/releases.json?_=' + Date.now(),
      { cache: 'no-store', signal: ctl.signal });
    clearTimeout(timer);
    if (r.ok){ const j = await r.json(); if (j.latest) latest = j.latest; online = true; }
  } catch (e){ /* 离线或跨域，退回内置版本表 */ }
  if (cmpVer(latest, APP_VER) > 0){
    toast('发现新版本 v' + latest + '，可在更新站下载');
  } else {
    toast('已是最新版本 v' + APP_VER + (online ? '' : '（离线比对内置日志）'));
  }
}
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1600);
}

/* ---- 启动 ---- */
function start(){
  const n = nowParts();
  state.y = n.y; state.m = n.m; state.d = n.d;
  state.hi = hourIdxOf(n.h);
  renderInfo();
  refreshAll();

  setInterval(() => {
    const c = nowParts();
    if (!state.pinned && !sameDate(state, c)){
      state.y = c.y; state.m = c.m; state.d = c.d;
      state.hi = hourIdxOf(c.h);
      state.rows = null;
      refreshAll();
      return;
    }
    const hi = hourIdxOf(c.h);
    if (state.autoHour && isToday() && hi !== state.hi){
      state.hi = hi;
      refreshAll();
    } else {
      renderHeader();
    }
  }, 15000);
}
start();

  /* 回到顶部 */
  const gt = document.createElement('button');
  gt.className = 'gotop';
  gt.type = 'button';
  gt.setAttribute('aria-label', '回到顶部');
  gt.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 11.5L12 5.5l6 6"/></svg>';
  gt.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  document.body.appendChild(gt);
  const onScroll = () => gt.classList.toggle('on', window.scrollY > 620);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

</script>
